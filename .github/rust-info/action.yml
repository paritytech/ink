name: Rust Info
description: Rust and Bash details
runs:
  using: composite
  steps:
    - run: |
        rustup show
        cargo --version
        rustup +nightly show
        cargo +nightly --version
        cargo spellcheck --version
        bash --version
        substrate-contracts-node --version

        # ink v5 needs cargo-contract v5; master targets ink v6.
        # Keep the image's stable toolchain intact for its existing CI tools.
        rustup toolchain install 1.99.1 --profile minimal --no-self-update
        cargo +1.99.1 install --git https://github.com/use-ink/cargo-contract --locked --branch v5.x.x --force
        cargo-contract --version
      shell: bash
