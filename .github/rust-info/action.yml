name: Rust Info
description: Rust and Bash details
runs:
  using: composite
  steps:
    - run: |
        rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update --component rust-src,clippy,rustfmt --target wasm32-unknown-unknown
        rustup show
        cargo --version
        rustfmt --version
        cargo spellcheck --version
        bash --version
        substrate-contracts-node --version

        # ink v5 needs cargo-contract v5; master targets ink v6.
        # Keep the image's stable toolchain intact for its existing CI tools.
        cargo install --git https://github.com/use-ink/cargo-contract --locked --branch v5.x.x --force
        cargo-contract --version
      shell: bash
